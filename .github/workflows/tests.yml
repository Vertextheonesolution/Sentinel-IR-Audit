name: Defensive checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (no third-party dependencies)
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Synthetic CLI smoke test
        run: python -m sentinel_ir_audit scan --input examples/synthetic-windows-observations.jsonl --output findings.jsonl --summary summary.json
        env:
          PYTHONPATH: src

  windows-collector-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell without execution
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'collectors/Collect-WindowsSnapshot.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PowerShell collector syntax is valid.'
