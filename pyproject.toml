[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ir-audit"
version = "0.1.0"
description = "Offline, read-only Windows incident-response observation triage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Vertextheonesolution"}]
keywords = ["incident-response", "windows", "security", "powershell", "ioc", "defensive"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
sentinel-ir-audit = "sentinel_ir_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
